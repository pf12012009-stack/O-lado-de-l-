# CodeQL (gratuito para repositórios públicos): análise estática de segurança.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      linguagens: ${{ steps.l.outputs.linguagens }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          if git ls-files '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' | grep -v '^tools/auditoria/' | grep -q .; then
            echo 'linguagens=["actions","javascript-typescript"]' >> "$GITHUB_OUTPUT"
          else
            echo 'linguagens=["actions"]' >> "$GITHUB_OUTPUT"
          fi
  analisar:
    needs: detectar
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detectar.outputs.linguagens) }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
