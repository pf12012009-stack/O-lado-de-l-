# Dependabot (gratuito no GitHub): alertas e PRs de atualização de dependências.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/tools/auditoria"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
